[package]
name = "pz-mod-manager"
version = "0.5.0"
description = "Gestor de mods de Project Zomboid con soporte de ZombieBuddy"
edition.workspace = true
license.workspace = true

[lib]
name = "pz_mod_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
pzmm-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
trash = "5.2.9"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62.2"
